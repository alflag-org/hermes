[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes"
version = "0.1.0"
description = "Infrastructure operation gateway for Atlas script releases"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0",
  "jsonschema>=4.0",
  "proxmoxer>=2.0",
]

[project.scripts]
hermes = "hermes.cli:main"

[tool.setuptools.packages.find]
where = ["modules"]

[tool.pytest.ini_options]
pythonpath = ["modules"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
