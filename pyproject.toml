[project]
name = "hermes"
version = "0.1.0"
description = "Infrastructure operation gateway for Atlas script releases"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0",
  "jsonschema>=4.0",
  "proxmoxer>=2.0",
]

[tool.pytest.ini_options]
pythonpath = ["modules"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
